[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "euclid-pdk"
version = "0.2.0"
description = "Python SDK for the euclid server"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Dr. Jens Vogt", email = "jensvogt47@gmail.com" }]
keywords = ["euclid", "sdk", "eam", "esm", "eqs", "ens", "ekm", "ess", "ekv", "eag", "eap",
            "ees", "ets", "object-storage", "message-queue", "secrets", "key-value",
            "api-gateway", "events", "sftp", "sigv4", "rfc9421"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
]

# Deliberately none. The wire protocol is JSON over HTTP and the signatures are HMAC-SHA256, both
# of which the standard library covers, so an application that installs this SDK does not thereby
# acquire a TLS stack, an HTTP client and a JSON parser it did not choose.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.urls]
Homepage = "https://github.com/jensvogt/euclid-pdk"
Server = "https://github.com/jensvogt/euclid"

[tool.hatch.build.targets.wheel]
packages = ["src/euclid"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
